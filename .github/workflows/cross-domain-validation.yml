name: Cross-domain validation

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit and cross-domain regression tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production application
        run: npm run build
